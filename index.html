<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Little Lemon · Browser preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3ed;color:#23312b;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;background:white;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ddd}section{padding:20px}h1,h2,p{margin:0 0 12px}h1{font: bold 42px Georgia;color:#f4ce14}h2{font: bold 27px Georgia}.hero{background:#314f42;color:white}.hero img{float:right;width:90px;height:106px;margin:0 0 8px 12px}.hero p{font-size:14px}img{object-fit:cover;border-radius:12px;background:#ecefe9}button,select,input{font:inherit}button,select{cursor:pointer;border:0;border-radius:12px;background:#edf0eb;color:#243d32;padding:9px 12px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #52836f}input:not([type=checkbox]){display:block;width:100%;padding:12px;border:1px solid #aab8ae;border-radius:10px;margin:5px 0 12px}label{display:block;margin:12px 0}.primary,.active{background:#f4ce14;color:#26352c;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.dish{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:white;padding:14px 0;border-radius:0;border-bottom:1px solid #ddd}.dish img{width:72px;height:72px}.dish small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#526259;margin:5px 0}.cover{width:100%;height:210px;margin-bottom:14px}footer{padding:18px;color:#647368;font-size:12px}button:disabled{opacity:.5}</style><main><header><button id="left">Bag</button><b>Little Lemon</b><button id="right">Profile</button></header><div id="page"></div><footer>Little Lemon · Interactive browser preview</footer></main><script>
const dishes=[{"id":1,"title":"Greek Salad","description":"The famous greek salad of crispy lettuce, peppers, olives, our Chicago.","price":"10","image":"https://github.com/Meta-Mobile-Developer-PC/Working-With-Data-API/blob/main/images/greekSalad.jpg?raw=true","category":"starters"},{"id":2,"title":"Lemon Desert","description":"Traditional homemade Italian Lemon Ricotta Cake.","price":"10","image":"https://github.com/Meta-Mobile-Developer-PC/Working-With-Data-API/blob/main/images/lemonDessert%202.jpg?raw=true","category":"desserts"},{"id":3,"title":"Grilled Fish","description":"Our Bruschetta is made from grilled bread that has been smeared with garlic and seasoned with salt and olive oil.","price":"10","image":"https://github.com/Meta-Mobile-Developer-PC/Working-With-Data-API/blob/main/images/grilledFish.jpg?raw=true","category":"mains"},{"id":4,"title":"Pasta","description":"Penne with fried aubergines, cherry tomatoes, tomato sauce, fresh chilli, garlic, basil & salted ricotta cheese.","price":"10","image":"https://github.com/Meta-Mobile-Developer-PC/Working-With-Data-API/blob/main/images/pasta.jpg?raw=true","category":"mains"},{"id":5,"title":"Bruschetta","description":"Oven-baked bruschetta stuffed with tomatos and herbs.","price":"10","image":"https://github.com/Meta-Mobile-Developer-PC/Working-With-Data-API/blob/main/images/bruschetta.jpg?raw=true","category":"starters"}], page=document.querySelector('#page'), left=document.querySelector('#left'), right=document.querySelector('#right');
let bag={},query='',category='All',order='Name',guest={first:'',last:'',email:'',updates:true,news:false},step=0;
try{guest=JSON.parse(localStorage.getItem('ll.preview.guest'))||guest}catch{}
function persist(){try{localStorage.setItem('ll.preview.guest',JSON.stringify(guest))}catch{}}
function photo(d){return d.image.replace('github.com/','raw.githubusercontent.com/').replace('/blob/','/').split('?')[0]}
const money=n=>'$'+Number(n).toFixed(2);
function nav(back){left.hidden=false;right.hidden=false;left.textContent=back?'‹ Menu':'Bag ('+Object.values(bag).reduce((a,b)=>a+b,0)+')';left.onclick=back?menu:cart;right.textContent=guest.first?guest.first[0].toUpperCase():'Profile';right.onclick=()=>profile(false)}
function menu(){nav(false);page.innerHTML='<section class="hero"><img alt="" src="'+photo(dishes[0])+'"><h1>Little Lemon</h1><h2>Chicago</h2><p>A family-run Mediterranean kitchen serving bright salads, grilled dishes and house desserts.</p><input id="search" type="search" placeholder="Search the menu" aria-label="Search the menu"></section><section><div class="row"><h2>Order for pickup</h2><select id="sort" aria-label="Sort menu"><option>Name</option><option>Price</option></select></div><div class="chips" id="chips"></div><div id="list"></div></section>';let search=document.querySelector('#search'),sort=document.querySelector('#sort');search.value=query;sort.value=order;search.oninput=()=>{query=search.value;rows()};sort.onchange=()=>{order=sort.value;rows()};for(const c of ['All','starters','mains','desserts']){let b=document.createElement('button');b.textContent=c[0].toUpperCase()+c.slice(1);if(c===category)b.className='active';b.onclick=()=>{category=c;menu()};document.querySelector('#chips').append(b)}rows()}
function rows(){let list=document.querySelector('#list');list.replaceChildren();let matches=dishes.filter(d=>(category==='All'||d.category===category)&&d.title.toLowerCase().includes(query.trim().toLowerCase())).sort((a,b)=>(order==='Price'&&Number(a.price)-Number(b.price))||a.title.localeCompare(b.title));if(!matches.length){list.innerHTML='<p>No dishes match your search.</p><button>Clear filters</button>';list.querySelector('button').onclick=()=>{query='';category='All';menu()}}for(const d of matches){let b=document.createElement('button');b.className='dish';b.innerHTML='<span><strong>'+d.title+'</strong><small>'+d.description+'</small>'+money(d.price)+'</span><img alt="" src="'+photo(d)+'">';b.onclick=()=>detail(d);list.append(b)}}
function detail(d){nav(true);page.innerHTML='<section><img class="cover" alt="" src="'+photo(d)+'"><h2>'+d.title+'</h2><p>'+d.description+'</p><p>'+money(d.price)+'</p><button class="primary">Add to bag</button></section>';page.querySelector('button').onclick=()=>{bag[d.id]=(bag[d.id]||0)+1;cart()}}
function cart(){nav(true);let total=0;page.innerHTML='<section><h2>Order bag</h2><div id="lines"></div></section>';let lines=document.querySelector('#lines');for(const d of dishes.filter(d=>bag[d.id])){total+=bag[d.id]*Number(d.price);let el=document.createElement('p');el.className='row';el.innerHTML='<span>'+d.title+' × '+bag[d.id]+'</span><button aria-label="Remove one '+d.title+'">−</button>';el.querySelector('button').onclick=()=>{bag[d.id]--;cart()};lines.append(el)}if(!total){lines.textContent='Your bag is empty.';return}lines.insertAdjacentHTML('beforeend','<p>Total '+money(total)+'</p><button class="primary">Confirm demo order</button>');lines.lastElementChild.onclick=()=>{bag={};lines.textContent='Order confirmed in this demo.'}}
function profile(setup){nav(true);right.hidden=true;page.innerHTML='<section><h2>'+(setup?['Welcome to Little Lemon','How can we reach you?','Your preferences'][step]:'Profile')+'</h2><form></form></section>';let f=page.querySelector('form');for(const [key,title,type,stage] of [['first','First name','text',0],['last','Last name','text',0],['email','Email','email',1],['updates','Order updates','checkbox',2],['news','Newsletter','checkbox',2]]){if(setup&&step!==stage)continue;let label=document.createElement('label'),input=document.createElement('input');input.type=type;input.name=key;if(type==='checkbox'){input.checked=guest[key];label.append(input,' '+title)}else{input.required=true;input.value=guest[key];label.append(title,input)}f.append(label)}let next=document.createElement('button');next.className='primary';next.textContent=setup&&step<2?'Next':'Save';f.append(next);f.onsubmit=e=>{e.preventDefault();for(const i of f.querySelectorAll('input'))guest[i.name]=i.type==='checkbox'?i.checked:i.value.trim();if(setup&&step<2){step++;profile(true)}else{persist();menu()}};let action=document.createElement('button');action.textContent=setup?'Explore the menu':'Start onboarding again';action.type='button';action.onclick=setup?menu:()=>{step=0;profile(true)};f.after(action)}
menu();</script></html>
