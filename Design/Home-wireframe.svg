</g><g id="menu-items">
<path d="M18 406 L372 406" stroke="#9eaaa5" fill="none"/><text x="18" y="436" fill="#282b2b" font-family="Arial" font-size="18" font-weight="700">Bruschetta</text><text x="18" y="458" fill="#282b2b" font-family="Arial" font-size="13" font-weight="400">Toasted bread with tomatoes</text><text x="18" y="475" fill="#282b2b" font-family="Arial" font-size="13" font-weight="400">and fresh herbs.</text><text x="18" y="499" fill="#282b2b" font-family="Arial" font-size="14" font-weight="700">$10.00</text><rect x="294" y="423" width="76" height="76" rx="6" fill="#dadcdb" stroke="#959a99"/><path d="M300 429 L364 493" stroke="#9eaaa5" fill="none"/><path d="M364 429 L300 493" stroke="#9eaaa5" fill="none"/>
